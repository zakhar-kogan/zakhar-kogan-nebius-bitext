[project]
name = "zakhar-kogan-nebius-bitext"
version = "0.1.0"
description = "LangGraph data analyst agent for the Bitext customer support dataset."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb==1.1.3",
  "fastmcp==2.12.3",
  "huggingface-hub==0.26.2",
  "langchain-core==0.3.80",
  "langchain-openai==0.3.35",
  "langgraph==0.6.8",
  "langgraph-checkpoint-sqlite==2.0.11",
  "polars==1.12.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "rapidfuzz==3.10.1",
  "streamlit==1.39.0",
  "tenacity==9.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-cov==5.0.0",
]

[project.scripts]
bitext-agent = "bitext_agent.cli:main"
bitext-start = "bitext_agent.start:main"
start = "bitext_agent.start:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/bitext_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
