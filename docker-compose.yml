services:
  streamlit:
    build: .
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
  mcp:
    build: .
    env_file:
      - .env
    command: ["uv", "run", "fastmcp", "run", "src/bitext_agent/mcp_server.py:mcp"]
    volumes:
      - ./data:/app/data

